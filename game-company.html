<script id="plantuml-source" type="application/json">"@startwbs\n\n- ゲーム会社（Game Company）部門＆職種＆責務\n    \n\n** 01. 経営・コーポレート部門（Corporate Management）\n\n*** 経営企画（Corporate Planning）  \n**** 経営戦略・事業計画策定  \n**** 中期経営計画・年度計画管理  \n**** 経営KPI・業績分析  \n**** 経営会議・意思決定支援\n\n*** 法務・コンプライアンス（Legal & Compliance）  \n**** 契約・法務審査管理  \n**** 法令・規制対応  \n**** コンプライアンス・リスク管理  \n**** 知的財産・ライセンス管理\n\n*** 財務・会計（Finance & Accounting）  \n**** 財務計画・資金管理  \n**** 予算・実績管理  \n**** 会計・決算管理  \n**** 税務・財務報告管理\n\n*** 人事（Human Resources）  \n**** 人事戦略・人員計画  \n**** 採用・人材配置管理  \n**** 評価・報酬・労務管理  \n**** 人材育成・組織開発\n\n*** 総務（General Affairs）  \n**** オフィス・設備・資産管理  \n**** 社内規程・文書管理  \n**** 株主総会・社内行事運営  \n**** 庶務・社内環境管理\n\n*** 社内IT（Corporate IT）  \n**** 社内IT基盤・システム管理  \n**** アカウント・端末・IT資産管理  \n**** 社内ネットワーク・業務環境管理  \n**** ITヘルプデスク・ユーザーサポート\n\n** 02. プロダクト部門（Product）\n\n*** プロダクトマネージャー（Product Manager）  \n**** プロダクトビジョン・ロードマップ管理  \n**** プロダクト要件・優先順位管理  \n**** ユーザー価値・プロダクト品質管理  \n**** プロダクトKPI・成果管理\n\n*** プロダクトディレクター（Product Director）  \n**** プロダクト戦略・事業方針策定  \n**** プロダクトポートフォリオ・ロードマップ管理  \n**** プロダクト目標・成果管理  \n**** プロダクト組織・開発方針管理\n\n** 03. プロジェクト管理部門（Project Management）\n\n*** プロジェクトマネージャー（Project Manager）  \n**** プロジェクト計画・進行管理  \n**** スケジュール・マイルストーン管理  \n**** リソース・予算管理  \n**** リスク・課題管理  \n**** プロジェクト成果・品質管理\n\n*** プロジェクトコーディネーター（Project Coordinator）  \n**** プロジェクト進行・タスク管理  \n**** 会議・情報・ドキュメント管理  \n**** チーム間コミュニケーション・調整  \n**** スケジュール・進捗情報管理\n\n** 04. ゲーム企画・デザイン部門（Game Design）\n\n*** ゲームデザイナー（Game Designer）  \n**** ゲーム全体設計・ゲーム体験設計  \n**** コアゲームループ・プレイサイクル設計  \n**** ゲームルール・ゲーム仕様設計  \n**** ゲームプレイ・機能要件管理\n\n*** システムデザイナー（System Designer）  \n**** ゲームシステム・ルール設計  \n**** 成長・進行システム設計  \n**** アイテム・スキル・機能仕様設計  \n**** システム間連携・整合性管理\n\n*** レベルデザイナー（Level Designer）  \n**** レベル構成・ゲームプレイ空間設計  \n**** ステージ・マップ・導線設計  \n**** 敵・ギミック・配置設計  \n**** 難易度・プレイ体験調整\n\n*** バトルデザイナー（Battle Designer）  \n**** バトルシステム・戦闘ルール設計  \n**** プレイヤー・敵・ボス仕様設計  \n**** スキル・武器・戦闘パラメータ設計  \n**** バトルバランス・難易度調整\n\n*** エコノミーデザイナー（Economy Designer）  \n**** ゲーム内経済・通貨システム設計  \n**** アイテム・報酬・価格設計  \n**** 収益・消費・供給設計  \n**** 経済バランス・インフレーション管理\n\n*** ナラティブデザイナー（Narrative Designer）  \n**** ストーリー・ナラティブ構造設計  \n**** クエスト・会話・イベント設計  \n**** キャラクター・世界観設定連携  \n**** ナラティブ演出・ゲームプレイ統合\n\n*** テクニカルデザイナー（Technical Designer）  \n**** ゲーム仕様・技術要件設計  \n**** デザインデータ・ゲームロジック設計  \n**** デザイナー・エンジニア連携  \n**** プロトタイプ・技術検証\n\n** 05. アート・UX部門（Art & UX）\n\n*** アートディレクター（Art Director）  \n**** アートビジョン・ビジュアル方針策定  \n**** アート品質・表現基準管理  \n**** アート制作・レビュー管理  \n**** アートチーム・外部制作管理\n\n*** コンセプトアーティスト（Concept Artist）  \n**** 世界観・ビジュアルコンセプト設計  \n**** キャラクター・環境コンセプト制作  \n**** ビジュアルリファレンス・デザイン開発  \n**** コンセプト・アート資料作成\n\n*** キャラクターアーティスト（Character Artist）  \n**** キャラクターモデル・デザイン制作  \n**** キャラクター衣装・装備制作  \n**** キャラクターマテリアル・テクスチャ制作  \n**** キャラクターアセット品質管理\n\n*** 環境アーティスト（Environment Artist）  \n**** 環境モデル・アセット制作  \n**** 建築・地形・背景アセット制作  \n**** マテリアル・テクスチャ制作  \n**** 環境アセット品質管理\n\n*** レベルアーティスト（Level Artist）  \n**** レベルビジュアル・景観設計  \n**** 地形・建築・背景配置  \n**** ライティング・環境演出  \n**** レベルアート品質・最適化\n\n*** UIアーティスト（UI Artist）  \n**** UIビジュアルデザイン  \n**** UIグラフィック・アイコン制作  \n**** UIレイアウト・ビジュアル表現設計  \n**** UIアセット品質管理\n\n*** UXデザイナー（UX Designer）  \n**** ユーザー体験・UX設計  \n**** ユーザーフロー・画面構成設計  \n**** 操作性・情報設計  \n**** UX検証・改善\n\n*** アニメーター（Animator）  \n**** キャラクター・オブジェクトアニメーション制作  \n**** モーション・演出制作  \n**** リギング・アニメーション設定  \n**** アニメーション品質・実装連携\n\n*** VFXアーティスト（VFX Artist）  \n**** エフェクト・視覚演出制作  \n**** パーティクル・シェーダー表現制作  \n**** 戦闘・スキル・環境エフェクト制作  \n**** VFX品質・性能最適化\n\n*** テクニカルアーティスト（Technical Artist）  \n**** アートパイプライン・制作環境構築  \n**** シェーダー・マテリアル技術支援  \n**** アセット最適化・技術検証  \n**** アーティスト向けツール・ワークフロー改善\n\n** 06. クライアント開発部門（Client Engineering）\n\n*** ゲームプレイエンジニア（Gameplay Engineer）  \n**** ゲームプレイロジック実装  \n**** キャラクター・操作機能実装  \n**** ゲームシステム・インタラクション実装  \n**** ゲームプレイ性能・安定性管理\n\n*** UIエンジニア（UI Engineer）  \n**** UIシステム・画面機能実装  \n**** UIインタラクション・入力処理実装  \n**** UIアニメーション・トランジション実装  \n**** UI性能・表示品質管理\n\n*** グラフィックスエンジニア（Graphics Engineer）  \n**** レンダリング・グラフィックス機能開発  \n**** シェーダー・マテリアル機能開発  \n**** ライティング・ポストエフェクト実装  \n**** グラフィックス性能・描画品質管理\n\n*** オーディオエンジニア（Audio Engineer）  \n**** オーディオシステム開発  \n**** サウンド再生・制御機能実装  \n**** オーディオミキシング・エフェクト実装  \n**** オーディオ性能・品質管理\n\n*** ツールエンジニア（Tools Engineer）  \n**** 開発ツール・エディタ機能開発  \n**** コンテンツ制作・データ処理ツール開発  \n**** アセット・ワークフロー自動化  \n**** 開発環境・ツール性能管理\n\n*** パフォーマンスエンジニア（Performance Engineer）  \n**** クライアント性能計測・分析  \n**** CPU・GPU・メモリ性能最適化  \n**** ロード時間・フレームレート最適化  \n**** 性能ボトルネック・リグレッション管理\n\n*** プラットフォームエンジニア（Platform Integration Engineer）  \n**** プラットフォーム機能・SDK統合  \n**** OS・デバイス・ハードウェア対応  \n**** プラットフォームAPI・外部サービス統合  \n**** プラットフォーム固有機能・互換性管理\n\n** 07. ゲームサーバー・バックエンド部門（Game Server & Backend）  \n*** ゲームサーバーエンジニア（Game Server Engineer）  \n**** ゲームロジック・ゲーム状態管理  \n**** マルチプレイヤー通信・セッション管理  \n**** ゲームワールド・プレイヤー状態管理  \n**** サーバー性能・スケーラビリティ管理\n\n*** バックエンドエンジニア（Backend Engineer）  \n**** API・バックエンドサービス開発  \n**** アカウント・認証・権限管理  \n**** ソーシャル・コミュニケーション機能開発  \n**** ショップ・決済・課金機能開発  \n**** 外部サービス・プラットフォーム連携\n\n*** データベースエンジニア（Database Engineer）  \n**** データベース・スキーマ設計  \n**** データモデル・データ整合性管理  \n**** クエリ・データアクセス性能管理  \n**** データ可用性・バックアップ管理  \n**** データ移行・容量管理\n\n** 08. インフラ・プラットフォーム部門（Infrastructure & Platform）  \n*** インフラエンジニア（Infrastructure Engineer）  \n**** サーバー・OS・ミドルウェア基盤管理  \n**** コンピューティング・ストレージ基盤管理  \n**** システム可用性・キャパシティ管理\n\n*** クラウドエンジニア（Cloud Engineer）  \n**** クラウド環境設計・構築  \n**** クラウドリソース・サービス管理  \n**** クラウドセキュリティ・コスト管理\n\n*** ネットワークエンジニア（Network Engineer）  \n**** ネットワーク設計・構築  \n**** 通信・接続・トラフィック管理  \n**** ネットワーク可用性・性能管理\n\n*** DevOpsエンジニア（DevOps Engineer）  \n**** CI/CDパイプライン設計・運用  \n**** ビルド・デプロイ自動化  \n**** 開発・運用プロセス自動化\n\n*** SREエンジニア（Site Reliability Engineer）  \n**** サービス信頼性・可用性管理  \n**** 障害対応・インシデント管理  \n**** オブザーバビリティ・性能管理  \n**** サービスレベル管理\n\n*** プラットフォームエンジニア（Platform Engineer）  \n**** 開発者向けプラットフォーム設計・開発  \n**** 開発環境・共通ツール基盤管理  \n**** セルフサービス・開発者体験向上\n\n** 09. データ・AI部門（Data & AI）  \n*** データエンジニア（Data Engineer）  \n**** データ収集・データパイプライン開発  \n**** データ処理・データ変換基盤開発  \n**** データ品質・データ連携管理\n\n*** データアナリスト（Data Analyst）  \n**** ゲーム・プロダクトデータ分析  \n**** KPI・ <script>
const lines=JSON.parse(document.getElementById('plantuml-source').textContent).split(/\r?\n/),root={children:[]},stack=[root];
for(const line of lines){const m=line.match(/^(\*+|-)\s*(.+?)\s*$/);if(!m)continue;const depth=m[1]==='-'?1:m[1].length,node={label:m[2],children:[]};stack[depth]=node;stack.length=depth+1;(stack[depth-1]||root).children.push(node)}
function render(nodes,depth){const list=document.createElement('ul');nodes.forEach(item=>{const li=document.createElement('li');li.className=`depth-${depth}`;const node=document.createElement('div');node.className='node';if(item.children.length){const toggle=document.createElement('button');toggle.className='toggle';toggle.type='button';toggle.textContent='⌄';toggle.setAttribute('aria-label','子項目を折りたたむ');const state=()=>{const closed=li.classList.toggle('collapsed');toggle.setAttribute('aria-label',closed?'子項目を展開する':'子項目を折りたたむ')};toggle.addEventListener('click',state);node.addEventListener('dblclick',state);node.append(toggle)}else{const spacer=document.createElement('span');spacer.className='spacer';node.append(spacer)}const label=document.createElement('span');label.className='label';label.textContent=item.label;if(item.children.length)label.addEventListener('click',()=>li.querySelector(':scope > .node > .toggle').click());node.append(label);li.append(node);if(item.children.length)li.append(render(item.children,depth+1));list.append(li)});return list}
document.getElementById('tree').append(render(root.children,1));
function showTo(depth){document.querySelectorAll('#tree li').forEach(el=>{const level=Number(el.className.match(/depth-(\d+)/)?.[1]);if(el.querySelector(':scope>ul'))el.classList.toggle('collapsed',level>=depth)})}
document.querySelectorAll('[data-depth]').forEach(button=>button.addEventListener('click',()=>showTo(Number(button.dataset.depth))));
document.getElementById('expand').addEventListener('click',()=>document.querySelectorAll('#tree .collapsed').forEach(el=>el.classList.remove('collapsed')));
showTo(3);
</script>
